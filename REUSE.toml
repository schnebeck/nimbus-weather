# Nimbus - REUSE.toml
# Licensing of files that cannot carry a header of their own (https://reuse.software).

version = 1

# Gradle wrapper, as generated by Gradle
[[annotations]]
path = ["gradlew", "gradlew.bat", "gradle/wrapper/**"]
precedence = "override"
SPDX-FileCopyrightText = "(C) 2015 the original authors of Gradle"
SPDX-License-Identifier = "Apache-2.0"

# Recorded API responses used as test data
[[annotations]]
path = [
    "app/src/test/resources/fixtures/openmeteo_*.json",
    "app/src/test/resources/fixtures/geocoding.json",
    "app/src/test/resources/fixtures/cams_pollen.json",
]
SPDX-FileCopyrightText = [
    "Weather data by Open-Meteo.com",
    "Weather data by MET Norway (MET Nordic), via Open-Meteo.com",
    "Contains modified Copernicus Atmosphere Monitoring Service information 2026",
    "Place names from GeoNames.org",
]
SPDX-License-Identifier = "CC-BY-4.0"

[[annotations]]
path = [
    "app/src/test/resources/fixtures/brightsky_*.json",
    "app/src/test/resources/fixtures/dwd_pollen*.json",
]
SPDX-FileCopyrightText = "Deutscher Wetterdienst (DWD), partly via Bright Sky"
SPDX-License-Identifier = "CC-BY-4.0"

[[annotations]]
path = "app/src/test/resources/fixtures/openfreemap_dark_style.json"
SPDX-FileCopyrightText = ["OpenFreeMap (map style)", "OpenMapTiles, CARTO (style design)"]
SPDX-License-Identifier = "BSD-3-Clause AND CC-BY-4.0"

[[annotations]]
path = "app/src/test/resources/fixtures/sensor_community.json"
SPDX-FileCopyrightText = "Sensor.Community contributors"
SPDX-License-Identifier = "ODbL-1.0"

# The task description of the project
[[annotations]]
path = "CLAUDE.md"
SPDX-FileCopyrightText = "(C) 2026 Thorsten Schnebeck <thorsten.schnebeck@gmx.net>"
SPDX-License-Identifier = "GPL-3.0-or-later"

# Reference images of the screenshot tests: the charts rendered from made-up test data
[[annotations]]
path = "app/src/test/screenshots/*.png"
SPDX-FileCopyrightText = "(C) 2026 Thorsten Schnebeck <thorsten.schnebeck@gmx.net>"
SPDX-License-Identifier = "GPL-3.0-or-later"

# Screenshots for the project page: the app with weather, radar and map data shown in it
[[annotations]]
path = ["docs/screenshots/*.png", "docs/screenshots/en/*.png"]
SPDX-FileCopyrightText = [
    "(C) 2026 Thorsten Schnebeck <thorsten.schnebeck@gmx.net>",
    "Weather data: Deutscher Wetterdienst (DWD), Open-Meteo.com",
    "Precipitation over the place: Deutscher Wetterdienst (DWD), RADOLAN",
    "Sunshine from the satellite: Deutscher Wetterdienst (DWD), from EUMETSAT data, via Open-Meteo.com",
]
SPDX-License-Identifier = "CC-BY-4.0"

[[annotations]]
path = ["docs/screenshots/radar.png", "docs/screenshots/en/radar.png"]
precedence = "override"
SPDX-FileCopyrightText = [
    "(C) 2026 Thorsten Schnebeck <thorsten.schnebeck@gmx.net>",
    "Radar and weather data: Deutscher Wetterdienst (DWD), KNMI, RainViewer, Open-Meteo.com",
    "Map: OpenFreeMap, OpenMapTiles, OpenStreetMap contributors",
]
SPDX-License-Identifier = "CC-BY-4.0 AND ODbL-1.0"

# Extra entries for the in-app license list (code that is not a Gradle dependency)
[[annotations]]
path = ["app/aboutlibraries/libraries/*.json", "app/aboutlibraries/licenses/nimbus-gpl-3.0-or-later.json"]
SPDX-FileCopyrightText = "(C) 2026 Thorsten Schnebeck <thorsten.schnebeck@gmx.net>"
SPDX-License-Identifier = "GPL-3.0-or-later"

[[annotations]]
path = "app/aboutlibraries/licenses/suncalc-bsd-2-clause.json"
SPDX-FileCopyrightText = "(C) 2026 Volodymyr Agafonkin (SunCalc)"
SPDX-License-Identifier = "BSD-2-Clause"

[[annotations]]
path = "app/src/test/resources/fixtures/nominatim_reverse.json"
SPDX-FileCopyrightText = "OpenStreetMap contributors (via Nominatim)"
SPDX-License-Identifier = "ODbL-1.0"

# Store listing for F-Droid (texts and images)
[[annotations]]
path = ["fastlane/metadata/android/**/*.txt", "fastlane/metadata/android/*/images/icon.png"]
SPDX-FileCopyrightText = "(C) 2026 Thorsten Schnebeck <thorsten.schnebeck@gmx.net>"
SPDX-License-Identifier = "GPL-3.0-or-later"

[[annotations]]
path = ["fastlane/metadata/android/*/images/featureGraphic.png", "fastlane/metadata/android/*/images/phoneScreenshots/*.png"]
SPDX-FileCopyrightText = [
    "(C) 2026 Thorsten Schnebeck <thorsten.schnebeck@gmx.net>",
    "Radar and weather data: Deutscher Wetterdienst (DWD), KNMI, RainViewer, Open-Meteo.com",
    "Sunshine from the satellite: Deutscher Wetterdienst (DWD), from EUMETSAT data, via Open-Meteo.com",
    "Map: OpenFreeMap, OpenMapTiles, OpenStreetMap contributors",
]
SPDX-License-Identifier = "CC-BY-4.0 AND ODbL-1.0"

# F-Droid build recipe (kept in the canonical format of `fdroid rewritemeta`, which allows no comments)
[[annotations]]
path = "docs/fdroid/dev.nimbus.weather.yml"
SPDX-FileCopyrightText = "(C) 2026 Thorsten Schnebeck <thorsten.schnebeck@gmx.net>"
